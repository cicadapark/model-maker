name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python:
    name: Python tests (the checks, the bake, the export; no card)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # rust-toolchain.toml pins the version; the runner's rustup installs it on first use.
      - run: rustup show active-toolchain
      - run: cargo build --locked -p model-maker-simplify
      - name: tesseract, for the lettering tests
        # The check "no painted lettering" reads with tesseract 5 or newer and its English data (docs/setup.md); the
        # runner's Ubuntu 24.04 packages 5.3.4. An older one would make the reading tests skip: refused here.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
          version=$(tesseract --version 2>&1 | head -n 1)
          echo "$version"
          major=$(grep -oE '[0-9]+' <<< "$version" | head -n 1)
          test "$major" -ge 5
          languages=$(tesseract --list-langs 2>&1)
          grep -qx eng <<< "$languages"
      - name: Tests
        # The packages the tests import and what they need, exactly as the lock pins them, every wheel's sha256
        # checked (the lock's entries for those names, nothing resolved anew).
        run: |
          python -m venv .venv
          python3 -I -c 'import re, sys
          names = set(sys.argv[2:])
          blocks = re.split(r"\n(?=\S)", open(sys.argv[1]).read())
          print("\n".join(b for b in blocks if b.split("==")[0] in names))' python/requirements.lock \
            numpy scipy pillow scikit-image trimesh imageio lazy-loader networkx packaging tifffile \
            c2pa-python cryptography cffi pycparser \
            > "$RUNNER_TEMP/test-requirements.txt"
          .venv/bin/pip install --quiet --no-deps --require-hashes --only-binary :all: -r "$RUNNER_TEMP/test-requirements.txt"
          # Without torch (setup.sh installs it; a runner has no card) the tests that need it skip, each saying why:
          # every skipped test is listed with its reason, then the count.
          status=0
          (cd python && ../.venv/bin/python -m unittest discover -v -s tests -t .) > "$RUNNER_TEMP/tests.log" 2>&1 || status=$?
          grep -E ' \.\.\. skipped ' "$RUNNER_TEMP/tests.log" || true
          echo "skipped: $(grep -cE ' \.\.\. skipped ' "$RUNNER_TEMP/tests.log")"
          if [ "$status" -ne 0 ]; then tail -n 80 "$RUNNER_TEMP/tests.log"; fi
          tail -n 3 "$RUNNER_TEMP/tests.log"
          # tesseract is installed above: a lettering test that skips here means the reader went untested.
          if grep -E 'tests\.test_lettering\..* \.\.\. skipped ' "$RUNNER_TEMP/tests.log"; then
            echo "the lettering tests must run here, not skip"
            exit 1
          fi
          exit "$status"
      - name: The tools' tests
        run: python3 -I -m unittest discover -s tools -p 'test_*.py'

  deny:
    name: cargo deny (licences, sources, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check

  licences:
    name: licence check (Python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Python packages
        # Exactly the lock, as setup.sh installs it (the CUDA build of torch and NVIDIA's libraries with it), so the
        # check reads the wheels users get and every library they bundle (requirements.txt with torch's CPU build
        # would check other versions).
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --no-deps --require-hashes --only-binary :all: -r python/requirements.lock
          .venv/bin/python -I python/model_maker/check_licences.py --list

  audit:
    name: vulnerability audit (Python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Known vulnerabilities in the locked packages
        # pip-audit from its own lock (tools/ci/pip-audit.lock, every wheel's sha256 checked) reads the environment's
        # lock as it is: every package and version pinned, so nothing is resolved or installed (--disable-pip), and
        # a package it cannot look up fails the job (--strict) as a known vulnerability does. The advisories it does
        # not fail on are listed, each with why and a review date, in tools/ci/pip-audit-ignore.toml, and only those.
        run: |
          python -m venv .audit
          .audit/bin/pip install --quiet --no-deps --require-hashes --only-binary :all: -r tools/ci/pip-audit.lock
          ignored=$(python3 -I -c 'import sys, tomllib
          for entry in tomllib.load(open(sys.argv[1], "rb"))["ignore"]:
              print("--ignore-vuln", entry["id"])' tools/ci/pip-audit-ignore.toml)
          echo "ignored, as tools/ci/pip-audit-ignore.toml says why: $ignored"
          # shellcheck disable=SC2086
          .audit/bin/pip-audit --requirement python/requirements.lock --require-hashes --disable-pip --strict \
            --progress-spinner off --desc $ignored

  setup-check:
    name: setup.sh --check-only (runs; a runner has no GPU, so it reports that)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Syntax
        run: bash -n setup.sh
      - name: The check reports a missing graphics card and exits 1
        run: |
          set +e
          ./setup.sh --check-only | tee check.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q "NVIDIA graphics card" check.txt
