# The AI models model-maker uses, with their licences, hub revisions and the sha256 of every file.
# Each model's files are checked against these sums before anything is loaded; a file in a model's folder that runs
# code and is not listed is refused, and a model's own code checked out from its repository (`source`) is checked to be
# at its commit, with nothing changed or added, before it is imported. Only models whose licence allows commercial use
# without a fee are listed here.
#
# For setup.sh (setup/fetch_models.py): `folders` names the folder under models/ each hub repository's files go to
# (each file at its path within the repository); `source` is the model's own code (`files`: fetched file by file from
# its `raw` address, each checked against its sum; else checked out whole) at its commit into
# sources/; `gated` says the hub needs a signed-in account; `licence_text` is a licence's full text, shown before the
# download; a part with `fetch = false` is listed but not downloaded.

format = 1

