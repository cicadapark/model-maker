# The lettering check's labelled pictures (11 November 2026; docs/objects.md, "Painted lettering"): picture tries the
# trials painted (every try that looser limits would have refused, and 100 drawn at random from the rest), and 160
# painted for this by tools/trial/paint_tries.py, with the pipeline's own picture words and seeds, on the 16 GB card
# ("invite-3080") and the 12 GB card ("asked-3060"), for prompts that invite lettering ("an old iron anvil", "a wooden
# crate", "a brass plaque", "a gold coin") or ask for it ("a wooden sign that says OPEN", "a stone gravestone with an
# inscription"). None of release 1's unseen prompts is here. Labelled blind: each picture cropped round its cut-out,
# shuffled under a random code (`code`), with no word of its prompt or of what the reader read
# (tools/trial/lettering_sheets.py); every label was written before the key was opened.
#
# `shows`: "letters" (letters, words, numbers or a signature painted on the object, large enough to read as such),
# "none", or "unclear" (a mark too small to read: a maker's stamp a few pixels tall, a logo without letters), with
# `why` where it helps. `prompt` is the prompt it was painted for. `regression.py run` judges them as the case
# "lettering-pictures", as the pipeline's choice of try judges its prompt: "no painted lettering" must pass every
# picture showing none and every picture whose prompt asks for lettering, and refuse every picture showing letters
# its prompt does not ask for, but those marked `known_miss` (the reader's known limits, shown, not held: if one is
# caught one day, the run says so). "unclear" is shown, not held. Labels are never changed to make a run hold
# (docs/metrics.md, the honesty rules). The pictures themselves are not published (docs/objects.md, "The regression
# set").


