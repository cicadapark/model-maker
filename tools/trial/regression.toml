# The regression set: what the checks have caught (and what they once misread), each with the verdicts it must keep.
# `tools/trial/regression.py run DATA` runs it on the CPU, before any change to the pipeline or its checks; every case
# must hold. `tools/trial/regression.py build TRIALS DATA` copies each case's files (its picture, cut-out, shape, and
# paint when the case judges paint) from the trial folders under TRIALS, by `source`, into DATA.
#
# A case: `prompt` (how it is read), `must_fail` and `must_pass` (check names), `paint = true` to bake and judge the
# paint's coverage, `string` ("none" or "drawn") for a bow, `hollows_removed` (at least); `made_must_fail` and
# `made_must_pass` judge the shape as the model made it, before the finish levels a thing that stands, and `trimmed_mm`
# = [low, high] is how much that levelling must cut from its feet; `state = true` judges whether the picture shows the
# state its words ask for (the state judge's model from MODEL_MAKER_MODELS).
# `laid_deg` = [low, high] is how far a thing that lies (a book) must be turned to rest on its broad face.
# `fill = true` judges the paint touch-up's fill against the paint round it ("fill matches the paint round it").
# `carved_holes` is how many holes of the picture's outline the finish must carve a web from (carving): 0 for a chair's
# back, a stool, a table and a lantern, whose holes the shape keeps open or whose parts merely sit a little off them.
# `picture_only = true`: the case has only its picture and cut-out (copied as `picture.png` and `mask.png`), and is
# judged by the picture's checks alone. The state judge's labelled pictures are in `state-cases.toml`.
#
# The data is not published: the trials' folders (`source`), the early example (`example`, a commit of the
# development history) and the built DATA are not in this repository, only the cases and the sums of their files
# (regression-sums.json). `source` names a case's folder in those trials, the 12 GB card's runs among them as "3060".

