# The state judge's labelled pictures: every book and chest the trials painted (one copy of each picture), labelled by
# eye. `regression.py build` copies them into DATA/states and `regression.py run` judges them as the case
# "state-pictures": a picture showing the state its prompt asks for must pass "shows what the words ask", one showing the
# other state must fail it. `known_miss = true` marks a picture the judge still gets wrong: it is shown, not held, and
# the run says when it is caught. Labels are never changed to make a run hold (docs/metrics.md, the honesty rules).
# The pictures themselves are not published (docs/objects.md, "The regression set"); "3060" in a name or folder marks
# a picture painted on the 12 GB card.

