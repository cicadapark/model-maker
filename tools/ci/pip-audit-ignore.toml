# Known advisories CI's vulnerability audit does not fail on (.github/workflows/ci.yml, the job "vulnerability
# audit"): each one names the advisory, its other ids (the GHSA and CVE ids Dependabot and others show), the package
# and version it was read against, why it cannot be reached in model-maker as released, and the date it must be looked
# at again. tools/test_audit_ignores.py fails once a review date has passed, so an entry cannot stay without being read
# again. Nothing else is ignored.
#
# Read again for 0.3.3 (25 November 2026), with the model stack raised (torch 2.10.0, transformers 5.10.1, diffusers
# 0.38.0, accelerate 1.15.0): these 2 ids are exactly what pip-audit finds in python/requirements.lock with nothing
# ignored (0.3.2's lock: 50). What every reason rests on in 0.3.3: each model file is pinned by sha256 in
# registry/models.toml and checked before it is loaded; the weights are safetensors and no pickle is loaded; a code
# file (anything Python imports a module from, .so and .pyc too), pickle or configuration (.json, .jinja) the registry
# does not list is refused anywhere in a model folder, its .cache folder too, with --no-verify too, and so is a linked
# folder inside one; nothing is fetched from the hub at run time (HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE are set to 1
# when the package is imported); no code that runs passes trust_remote_code or custom_pipeline (the painter's pinned
# checkout holds such calls in modules never imported: its mesh tools, replaced by stand-ins, and its scripts);
# model-maker serves nothing on a network.
#
# "Pinned by sha256" holds with the sums checked, as every run does by default. With --no-verify the files' sums are
# not read, and the user vouches for them: what still holds then is that an unlisted file of those kinds is refused.

[[ignore]]
id = "PYSEC-2026-139"
aliases = ["CVE-2026-4538"]
package = "torch"
version = "2.10.0"
why = """Deserialisation in PyTorch's pt2 loading handler (torch.export archives), from a local attacker with access to
the machine (CVSS 3.1 7.8); no fixed version is published for CUDA 12 builds, and 2.10.0 is PyPI's last CUDA 12 build.
Not reachable: model-maker never loads a .pt2 archive and never calls torch.export or torch.load; its models are
safetensors files whose sha256 registry/models.toml pins, and MV-Adapter's and BiRefNet's code at the commits the
registry names do not use it either."""
review = "2027-02-25"

[[ignore]]
id = "PYSEC-2025-194"
aliases = ["CVE-2025-3000", "GHSA-rrmf-rvhw-rf47"]
package = "torch"
version = "2.10.0"
why = """Memory corruption in torch.jit.script, from a local attacker (GitHub rates it low). Fixed in torch 2.13.0, but
from 2.11 on PyPI's Linux build of torch is the CUDA 13 one (nvidia-*-cu13), which needs a newer driver than the CUDA 12
this release asks for; 2.10.0 is the last CUDA 12 build. model-maker never calls torch.jit.script (neither do
MV-Adapter's and BiRefNet's code at the registry's commits). Fixed when the release moves to CUDA 13 or PyPI ships a
CUDA 12 build with the fix."""
review = "2027-02-25"
