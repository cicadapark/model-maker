# Known advisories CI's vulnerability audit does not fail on (.github/workflows/ci.yml, the job "vulnerability
# audit"): each one names the advisory, the package and version it was read against, why it does not apply to
# model-maker or cannot be fixed yet, and the date it must be looked at again. tools/test_audit_ignores.py fails once
# a review date has passed, so an entry cannot stay without being read again. Nothing else is ignored.
#
# 0.2.1 keeps the model stack (torch, transformers, diffusers, accelerate) at the versions its results were measured
# with; Pillow, filelock, setuptools and certifi were raised. The model stack moves in its own version.

[[ignore]]
id = "PYSEC-2025-189"
package = "torch"
version = "2.5.1"
why = """Held at 2.5.1 for 0.2.1: moving torch changes model-maker's results (measured on 11 November: with the same
seeds 3 of 12 runs went from pass to fail), so the model stack moves in its own version, measured against a noise
floor. These advisories need a hostile model file, pickle or archive, or code that calls the affected function on
untrusted input; model-maker loads only safetensors and checkpoints whose sha256 the registry pins, runs locally and
serves nothing on a network."""
review = "2026-12-31"

