[package]
name = "model-maker-companion"
description = "The studio companion: a small window that checks and sets up this PC, makes one object locally and opens the studio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "model-maker-companion"
path = "src/main.rs"

[dependencies]
model-maker-launcher = { path = "../model-maker-launcher" }
# The widgets, with egui's bundled fonts OFF (their font licences are not ours to ship): the system's own font is read
# at start (fontdb). A test fails if the fonts crate comes back into the tree.
egui = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wayland", "x11"] }
winit = "=0.30.13"
# Drawn on the processor: the card stays free for the make (no card memory by design).
softbuffer = "=0.4.8"
fontdb = "=0.24.0"
open = "=5.4.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
